  <!-- Banner de consentimiento -->
  <div id="cookie-banner" class="cookie-banner">
    <p>
      Usamos cookies, Google Analytics y Google Ads (AdSense) para mejorar la experiencia, medir el tráfico y monetizar el sitio. 
      <button id="accept-cookies" class="btn-accept">Aceptar</button>
      <button id="reject-cookies" class="btn-reject">Rechazar</button>
    </p>
  </div>

  <style>
    .cookie-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
      font-size: 14px;
    }
    .cookie-banner p { margin: 0; }
    .btn-accept, .btn-reject {
      margin-left: 10px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-accept { background: #4CAF50; color: #fff; }
    .btn-reject { background: #f44336; color: #fff; }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const banner = document.getElementById("cookie-banner");
      const acceptBtn = document.getElementById("accept-cookies");
      const rejectBtn = document.getElementById("reject-cookies");

      if (localStorage.getItem("cookies-consent")) {
        banner.style.display = "none";
        if (localStorage.getItem("cookies-consent") === "accepted") {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-RQC4R8HV2R');
          gtag('config', 'G-KCRHDKJFF5');
        }
      }

      acceptBtn.addEventListener("click", function() {
        localStorage.setItem("cookies-consent", "accepted");
        banner.style.display = "none";
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-RQC4R8HV2R');
        gtag('config', 'G-KCRHDKJFF5');
      });

      rejectBtn.addEventListener("click", function() {
        localStorage.setItem("cookies-consent", "rejected");
        banner.style.display = "none";
      });
    });
  </script>

  <!-- Marca de agua -->
  <img src="{{ "/assets/logo.png" | relative_url }}" alt="DOA Token V2 Logo" class="watermark-logo">

  <style>
    .watermark-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.05;
      width: 70%;
      max-width: 900px;
      z-index: 0;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .watermark-logo {
        width: 90%;
        max-width: 500px;
      }
    }
